[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "delphos"
version = "0.1.0"
description = "Final-user Delphos package for proposing and estimating discrete choice model specifications."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.0,<2.9",
  "numpy>=1.26,<3.0",
  "pandas>=2.2,<3.0",
  "pyyaml>=6.0,<7.0",
  "tqdm>=4.66,<5.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["delphos*"]

[tool.pytest.ini_options]
addopts = "--cov=delphos --cov-report=term-missing -v"
testpaths = ["tests"]
